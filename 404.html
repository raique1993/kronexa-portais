<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Kronexa</title>
<link rel="icon" href="assets/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08081A;color:#F0F0FF;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.wrap{max-width:480px}
.logo{font-size:14px;font-weight:900;letter-spacing:2px;color:#6C3FE8;margin-bottom:32px}
.code{font-size:120px;font-weight:900;letter-spacing:-6px;color:#6C3FE8;line-height:1;margin-bottom:8px}
.title{font-size:22px;font-weight:700;margin-bottom:10px}
.sub{font-size:15px;color:#9090b0;margin-bottom:32px;line-height:1.6}
.btn{display:inline-block;padding:12px 28px;background:#6C3FE8;color:#fff;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;transition:all .2s}
.btn:hover{background:#5530c4;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">KRONEXA</div>
  <div class="code">404</div>
  <div class="title">Página não encontrada</div>
  <p class="sub">A página que você procura não existe ou foi movida. Volte para o início e encontre o que precisa.</p>
  <a href="/" class="btn">← Voltar ao início</a>
</div>
</body>
</html>
